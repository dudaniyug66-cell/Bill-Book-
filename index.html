<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bill Book - make bills for your shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F4F9; --card:#FFFFFF; --ink:#14203B; --muted:#5B6782; --line:#D9DFEA;
  --accent:#F5B301; --accent-ink:#14203B; --red:#C9352A; --green:#187A62;
  --soft:#E6ECF6; --focus:#2B59E6;
  --head:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1424; --card:#161E35; --ink:#E7EBF5; --muted:#9AA6C2; --line:#2A3556;
    --red:#FF7A6E; --green:#4CC9A6; --soft:#1D2745; --focus:#8FB0FF;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1424; --card:#161E35; --ink:#E7EBF5; --muted:#9AA6C2; --line:#2A3556;
  --red:#FF7A6E; --green:#4CC9A6; --soft:#1D2745; --focus:#8FB0FF;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;min-height:100%;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--head);line-height:1.1;margin:0;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.hint{font-size:13px;color:var(--muted)}
.no-print{}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:11px 18px;cursor:pointer;text-decoration:none;font-size:15px;line-height:1.2}
.btn:hover{filter:brightness(.96)}
.btn.lg{padding:15px 28px;font-size:18px;border-radius:12px}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:8px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:600}
.btn.ghost:hover{background:var(--soft);filter:none}
.btn.danger{background:var(--red);color:#fff}
.btn.link{background:none;padding:0;color:var(--focus);font-weight:600;border-radius:4px;font-size:13px}
.in{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:15px;min-width:0}
textarea.in{resize:vertical;min-height:70px}
.in[aria-invalid="true"]{border-color:var(--red)}
.field{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.field .hint{font-weight:400}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:500;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--focus)}

/* ---------- intro ---------- */
.intro{max-width:1080px;margin:0 auto;padding:36px 22px 60px;display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;min-height:calc(100vh - 20px)}
.mark{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:800;font-size:20px;margin-bottom:34px}
.mark i{width:22px;height:22px;border-radius:5px;background:var(--accent);display:inline-block;position:relative}
.mark i::after{content:"";position:absolute;left:5px;right:5px;top:6px;height:2px;background:var(--ink);box-shadow:0 5px 0 var(--ink)}
.intro h1{font-size:clamp(38px,6vw,64px);font-weight:800;margin-bottom:18px}
.intro .lead{font-size:18px;color:var(--muted);max-width:52ch;margin-bottom:28px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:40px;border-top:1px solid var(--line)}
.facts div{padding:16px 16px 0 0;font-size:14px;color:var(--muted)}
.facts b{display:block;color:var(--ink);font-size:15px;margin-bottom:2px}
.privacy{margin-top:22px;font-size:13px;color:var(--muted)}
.slip{background:#fff;color:#14203B;border-radius:6px 6px 0 0;padding:24px 24px 26px;max-width:380px;margin:0 auto;transform:rotate(2deg);box-shadow:0 30px 50px -28px rgba(20,32,59,.55);border-bottom:3px dashed #B9C2D6;font-size:14px}
.slip .sh{font-family:var(--head);font-weight:800;font-size:19px}
.slip .sm{font-size:12px;color:#5B6782}
.slip hr{border:0;border-top:1px dashed #B9C2D6;margin:14px 0}
.slip .row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-variant-numeric:tabular-nums;opacity:0;animation:rowin .45s ease forwards;animation-delay:calc(.35s + var(--n) * .32s)}
.slip .row small{display:block;color:#187A62;font-weight:600;font-size:11.5px}
.slip .tot{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--head);font-weight:800;font-size:26px;opacity:0;animation:stamp .4s ease forwards;animation-delay:2s}
.slip .tag{display:inline-block;background:#F5B301;color:#14203B;font-weight:700;font-size:11px;padding:2px 8px;border-radius:99px;margin-bottom:10px}
@keyframes rowin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes stamp{from{opacity:0;transform:scale(1.25)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.slip .row,.slip .tot{animation:none;opacity:1}}
@media (max-width:820px){.intro{grid-template-columns:1fr;gap:34px;min-height:0;padding-top:24px}.mark{margin-bottom:22px}.facts{grid-template-columns:1fr}}

/* ---------- app shell ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 18px 0;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 24px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:800;font-size:18px;padding-bottom:10px;background:none;border:0;cursor:pointer;text-align:left;min-width:0}
.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
.brand .lg{width:34px;height:34px;border-radius:8px;object-fit:cover;background:var(--soft);display:grid;place-items:center;font-size:16px;flex:none}
.tabs{display:flex;gap:4px;overflow-x:auto;max-width:100%}
.tab{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-size:15px}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
main{max-width:1080px;margin:0 auto;padding:24px 18px 70px}
.pagehead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
.pagehead h2{font-size:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.card + .card{margin-top:16px}
.card h3{font-size:19px;margin-bottom:14px}
.empty{border:2px dashed var(--line);border-radius:14px;padding:38px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px;font-family:var(--head)}
.empty .btn{margin-top:16px}

/* ---------- products ---------- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.pgrid.sm{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:14px 0}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.pimg{aspect-ratio:1/1;background:var(--soft);display:grid;place-items:center;overflow:hidden;width:100%}
.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.pimg .ph{font-family:var(--head);font-size:44px;font-weight:800;color:var(--muted)}
.pimg.lg{width:84px;height:84px;border-radius:12px;flex:none}
.pimg.lg .ph{font-size:32px}
.pbody{padding:10px 12px 12px;display:grid;gap:2px;flex:1}
.pbody b{font-size:15px;overflow-wrap:anywhere}
.pprice{font-weight:700;font-variant-numeric:tabular-nums}
.pmeta{font-size:12.5px;color:var(--muted)}
.pact{display:flex;gap:6px;margin-top:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0;text-align:left;cursor:pointer;overflow:hidden;display:flex;flex-direction:column}
.tile:hover{border-color:var(--focus)}
.tile .pbody{padding:8px 10px 10px}
.tile .pbody b{font-size:14px}
.photo-row{display:flex;gap:14px;align-items:center;margin-bottom:14px}

/* ---------- dialog ---------- */
dialog{border:0;border-radius:16px;padding:0;width:min(560px,94vw);max-height:90vh;background:var(--card);color:var(--ink);box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(10,15,30,.55)}
.dbody{padding:22px;display:grid;gap:14px}
.dbody h2{font-size:24px}
.drow{display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap;margin-top:6px}

/* ---------- setup ---------- */
.setup{max-width:760px;margin:0 auto;padding:30px 18px 70px}
.setup h1{font-size:clamp(30px,5vw,42px);margin-bottom:8px}
.setup .sec{margin-top:26px}
.setup .sec h3{font-size:18px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.errmsg{color:var(--red);font-weight:600;margin-top:14px;min-height:1.4em}
.logo-prev{width:72px;height:72px;border:1px dashed var(--line);border-radius:10px;display:grid;place-items:center;overflow:hidden;font-size:12px;color:var(--muted);flex:none;background:var(--bg)}
.logo-prev img{width:100%;height:100%;object-fit:contain}

/* ---------- bill maker ---------- */
.bill-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
@media (max-width:940px){.bill-grid{grid-template-columns:1fr}.side{position:static}}
.line{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);display:grid;gap:10px}
.line + .line{margin-top:10px}
.l-top{display:flex;gap:10px;align-items:center}
.l-top .pimg{width:44px;height:44px;border-radius:8px;flex:none}
.l-top .pimg .ph{font-size:18px}
.l-top .grow{flex:1;min-width:0}
.l-top .grow b{display:block;overflow-wrap:anywhere}
.l-amt{font-weight:800;font-variant-numeric:tabular-nums;font-family:var(--head);font-size:18px;white-space:nowrap}
.x{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:18px;line-height:1;flex:none}
.x:hover{color:var(--red);border-color:var(--red)}
.l-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.chip{font-size:12px;font-weight:700;color:var(--green);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip[hidden]{display:none}
.sumrow{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-variant-numeric:tabular-nums;font-size:15px}
.sumrow.muted{color:var(--muted)}
.sumrow.total{border-top:2px solid var(--ink);margin-top:8px;padding-top:12px;font-family:var(--head);font-weight:800;font-size:26px;align-items:baseline}
.sum .btn{width:100%;margin-top:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.seg{display:grid;grid-template-columns:1fr 110px;gap:8px}

/* ---------- history ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card)}
.stat span{font-size:13px;color:var(--muted);display:block}
.stat b{font-family:var(--head);font-size:24px;font-variant-numeric:tabular-nums}
.hrow{display:grid;grid-template-columns:1.1fr 1.6fr auto auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.hrow + .hrow{margin-top:8px}
.hrow small{display:block;color:var(--muted)}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--soft);white-space:nowrap}
.pill.due{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.pill.paid{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
@media (max-width:640px){.hrow{grid-template-columns:1fr auto}.hrow .hact{grid-column:1/-1}}

/* ---------- invoice sheet (always paper-white) ---------- */
.inv-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.sheetwrap{overflow-x:auto}
.sheet{background:#fff;color:#111827;max-width:820px;margin:0 auto;padding:30px;border:1px solid var(--line);border-radius:6px;font-size:14px;min-width:560px}
.sheet .head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:2px solid #111827;padding-bottom:14px}
.sheet .shop{display:flex;gap:12px;align-items:flex-start}
.sheet .shop img{width:60px;height:60px;object-fit:contain}
.sheet h2{font-size:24px;color:#111827}
.sheet .kind{font-family:var(--head);font-weight:800;font-size:20px;text-align:right}
.sheet .sub{color:#4B5563;font-size:13px;white-space:pre-line}
.sheet .meta{display:flex;justify-content:space-between;gap:20px;margin:14px 0;flex-wrap:wrap}
.sheet .meta div{max-width:48%;white-space:pre-line}
.sheet .lbl{font-size:12px;color:#6B7280;font-weight:600}
.sheet table{width:100%;border-collapse:collapse}
.sheet th{text-align:left;font-size:12px;border-bottom:2px solid #111827;padding:7px 5px;white-space:nowrap}
.sheet td{padding:8px 5px;border-bottom:1px solid #E5E7EB;vertical-align:top}
.sheet .num{text-align:right;font-variant-numeric:tabular-nums}
.sheet .bottom{display:flex;justify-content:space-between;gap:24px;margin-top:14px;flex-wrap:wrap}
.sheet .words{flex:1;min-width:220px;font-size:13px}
.sheet .tots{min-width:250px}
.sheet .tr{display:flex;justify-content:space-between;padding:3px 0;font-variant-numeric:tabular-nums}
.sheet .tr.g{border-top:2px solid #111827;margin-top:6px;padding-top:8px;font-family:var(--head);font-weight:800;font-size:20px}
.sheet .foot{margin-top:22px;padding-top:12px;border-top:1px dashed #9CA3AF;display:flex;justify-content:space-between;gap:20px;font-size:12.5px;color:#4B5563;flex-wrap:wrap}
.sheet .sign{text-align:right;min-width:160px}
.sheet .sign div{height:44px}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}

@media print{
  @page{margin:12mm}
  .no-print{display:none!important}
  html,body{background:#fff!important}
  :root{padding:0!important}
  main{padding:0!important;max-width:none!important}
  .sheetwrap{overflow:visible}
  .sheet{border:0!important;border-radius:0!important;padding:0!important;max-width:none!important;min-width:0!important}
}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg" aria-label="Dialog"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<datalist id="gstlist"><option value="0"><option value="3"><option value="5"><option value="18"><option value="40"></datalist>
<datalist id="stateslist"></datalist>

<script>
/* ============ helpers ============ */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const todayISO = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const fmtDate = iso => { const [y,m,d]=(iso||'').split('-'); return d ? `${d}/${m}/${y}` : ''; };
const inr = n => '\u20B9' + (Number(n)||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const UNITS = ['pcs','kg','g','litre','ml','meter','cm','box','pack','dozen','pair','set','bag','bottle'];
const PAY = ['Cash','UPI','Card','Bank transfer','Credit (pay later)'];
const STATES = ['Andhra Pradesh','Arunachal Pradesh','Assam','Bihar','Chhattisgarh','Goa','Gujarat','Haryana','Himachal Pradesh','Jharkhand','Karnataka','Kerala','Madhya Pradesh','Maharashtra','Manipur','Meghalaya','Mizoram','Nagaland','Odisha','Punjab','Rajasthan','Sikkim','Tamil Nadu','Telangana','Tripura','Uttar Pradesh','Uttarakhand','West Bengal','Delhi','Jammu and Kashmir','Ladakh','Chandigarh','Puducherry','Andaman and Nicobar Islands','Dadra and Nagar Haveli and Daman and Diu','Lakshadweep'];
$('#stateslist').innerHTML = STATES.map(s=>`<option value="${s}">`).join('');

const mem = {};
const store = {
  get(k, d){ try{ const v=localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return (k in mem) ? mem[k] : d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ mem[k]=v; toast("Couldn't save to this browser (storage may be full or blocked)."); return false; } }
};

let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2600); }

function words(n){
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two = x => x<20 ? a[x] : b[Math.floor(x/10)] + (x%10 ? ' '+a[x%10] : '');
  const three = x => x>=100 ? a[Math.floor(x/100)]+' Hundred'+(x%100 ? ' '+two(x%100) : '') : two(x);
  if(n===0) return 'Zero';
  let out=''; const cr=Math.floor(n/1e7); n%=1e7; const lk=Math.floor(n/1e5); n%=1e5; const th=Math.floor(n/1e3); n%=1e3;
  if(cr) out+=three(cr)+' Crore '; if(lk) out+=two(lk)+' Lakh '; if(th) out+=two(th)+' Thousand '; if(n) out+=three(n);
  return out.trim();
}
function amountWords(v){
  const r=Math.floor(v+1e-9), p=Math.round((v-r)*100);
  return 'Rupees ' + words(r) + (p ? ' and ' + words(p) + ' Paise' : '') + ' Only';
}

function thumb(file, max, type, q){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width*s)); c.height = Math.max(1, Math.round(img.height*s));
        const x = c.getContext('2d');
        if(type === 'image/jpeg'){ x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); }
        x.drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL(type, q));
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

/* ============ state ============ */
const S = { view:'intro', tab:'products', shop:null, products:[], bills:[], counter:1, draft:null, viewBill:null, pq:'', hq:'', tmpImg:'', tmpLogo:'', editId:null, pickCount:0 };
function load(){
  S.shop = store.get('bb_shop', null);
  S.products = store.get('bb_products', []);
  S.bills = store.get('bb_bills', []);
  S.counter = store.get('bb_counter', 1);
}
const saveProducts = () => store.set('bb_products', S.products);
const saveBills = () => store.set('bb_bills', S.bills);
const hasGST = () => !!(S.shop && S.shop.gstin);
const newDraft = () => ({ customer:{name:'',phone:'',address:'',gstin:''}, date:todayISO(), interState:false, inclusive:false, items:[], discType:'amt', discVal:'', payMode:'Cash', paid:'', note:'' });
const setPath = (o, path, v) => { const k=path.split('.'); let t=o; while(k.length>1) t=t[k.shift()]; t[k[0]]=v; };

/* ============ calculations ============ */
function calc(b){
  const lines = b.items.map(it => {
    const q=+it.qty||0, p=+it.price||0, d=Math.min(100,Math.max(0,+it.disc||0));
    const gross=q*p; return { gross, net:gross*(1-d/100), g:+it.gst||0 };
  });
  const gross = lines.reduce((s,l)=>s+l.gross,0);
  const sumNet = lines.reduce((s,l)=>s+l.net,0);
  const dv = +b.discVal || 0;
  const extra = b.discType==='pct' ? sumNet*Math.min(100,Math.max(0,dv))/100 : Math.min(sumNet,Math.max(0,dv));
  const f = sumNet>0 ? (sumNet-extra)/sumNet : 1;
  let taxable=0, tax=0;
  lines.forEach(l => {
    const n = l.net*f;
    if(b.inclusive){ l.taxable = n/(1+l.g/100); l.tax = n-l.taxable; } else { l.taxable = n; l.tax = n*l.g/100; }
    l.total = l.taxable + l.tax; taxable += l.taxable; tax += l.tax;
  });
  const exact = taxable + tax, grand = Math.round(exact);
  return { lines, gross, discount: gross - exact + (b.inclusive ? 0 : tax) , extra, taxable, tax,
    cgst: b.interState?0:tax/2, sgst: b.interState?0:tax/2, igst: b.interState?tax:0,
    exact, round: grand-exact, grand };
}
function paidAmount(d, t){
  const credit = String(d.payMode||'').startsWith('Credit');
  const raw = (d.paid===''||d.paid==null) ? (credit ? 0 : t.grand) : (+d.paid||0);
  return Math.min(Math.max(0,raw), t.grand);
}

function sumHTML(t){
  const d = S.draft, paid = paidAmount(d,t), bal = t.grand - paid;
  const disc = t.gross - (t.taxable + (d.inclusive ? t.tax : 0));
  const rows = [];
  rows.push(`<div class="sumrow"><span>Items total</span><span>${inr(t.gross)}</span></div>`);
  if(disc > 0.004) rows.push(`<div class="sumrow muted"><span>Discount</span><span>- ${inr(disc)}</span></div>`);
  if(hasGST()){
    rows.push(`<div class="sumrow muted"><span>Taxable value</span><span>${inr(t.taxable)}</span></div>`);
    if(d.interState) rows.push(`<div class="sumrow muted"><span>IGST</span><span>${inr(t.igst)}</span></div>`);
    else rows.push(`<div class="sumrow muted"><span>CGST</span><span>${inr(t.cgst)}</span></div><div class="sumrow muted"><span>SGST</span><span>${inr(t.sgst)}</span></div>`);

  if(Math.abs(t.round) > 0.004) rows.push(`<div class="sumrow muted"><span>Round off</span><span>${t.round>0?'+':'-'} ${inr(Math.abs(t.round))}</span></div>`);
  rows.push(`<div class="sumrow total"><span>Total</span><span>${inr(t.grand)}</span></div>`);
  if(bal > 0.004) rows.push(`<div class="sumrow"><span>Received</span><span>${inr(paid)}</span></div><div class="sumrow" style="color:var(--red);font-weight:700"><span>Balance due</span><span>${inr(bal)}</span></div>`);

    <button class="btn ghost" data-act="tab" data-tab="bill">New bill</button>
    <button class="btn" data-act="print">Print or save as PDF</button>
    <a class="btn ghost" href="${waLink(b)}" target="_blank" rel="noopener">Send on WhatsApp</a>
  </div>
  <p class="hint no-print" style="margin-bottom:12px">In the print window, choose "Save as PDF" as the printer to keep a copy.</p>
  <div class="sheetwrap">${invoiceHTML(b)}</div>`;
}
function invoiceHTML(b){
  const s = b.shop, t = calc(b), gst = !!s.gstin;
  const anyDisc = b.items.some(i => +i.disc > 0);
  const bal = b.grand - b.paidAmt;
  const addr = [s.address, [s.city, s.state, s.pin].filter(Boolean).join(', ')].filter(Boolean).join('\n');
  const contact = [s.phone && 'Phone: '+s.phone, s.email].filter(Boolean).join('  |  ');
  const ids = [s.gstin && 'GSTIN: '+s.gstin, s.pan && 'PAN: '+s.pan, s.license].filter(Boolean).join('  |  ');
  const c = b.customer;
  const rows = b.items.map((it,i)=>`<tr><td>${i+1}</td><td>${esc(it.name)}${gst&&it.hsn?`<br><span class="lbl">HSN ${esc(it.hsn)}</span>`:''}</td>
    <td class="num">${+it.qty} ${esc(it.unit)}</td><td class="num">${inr(it.price).slice(1)}</td>${anyDisc?`<td class="num">${+it.disc?(+it.disc)+'%':''}</td>`:''}${gst?`<td class="num">${+it.gst}%</td>`:''}<td class="num">${inr(t.lines[i].total).slice(1)}</td></tr>`).join('');
  const disc = t.gross - (t.taxable + (b.inclusive ? t.tax : 0));
  return `<div class="sheet" id="sheet">
    <div class="head"><div class="shop">${S.shop && S.shop.logo ? `<img src="${S.shop.logo}" alt="">` : ''}<div><h2>${esc(s.name)}</h2>
      <div class="sub">${esc(addr)}${contact?'\n'+esc(contact):''}${ids?'\n'+esc(ids):''}</div></div></div>
      <div class="kind">${gst ? 'Tax Invoice' : 'Bill'}</div></div>
    <div class="meta"><div><span class="lbl">Billed to</span><br><b>${esc(c.name)}</b>${c.phone?'\n'+esc(c.phone):''}${c.address?'\n'+esc(c.address):''}${c.gstin?'\nGSTIN: '+esc(c.gstin):''}</div>
      <div style="text-align:right"><span class="lbl">Bill no.</span> <b>${esc(b.no)}</b><br><span class="lbl">Date</span> <b>${fmtDate(b.date)}</b><br><span class="lbl">Payment</span> ${esc(b.payMode)}</div></div>
    <table><thead><tr><th>#</th><th style="width:100%">Item</th><th class="num">Qty</th><th class="num">Rate</th>${anyDisc?'<th class="num">Disc.</th>':''}${gst?'<th class="num">GST</th>':''}<th class="num">Amount</th></tr></thead><tbody>${rows}</tbody></table>
    ${gst && b.inclusive ? '<div class="lbl" style="margin-top:6px">Rates shown include GST.</div>' : ''}
    <div class="bottom"><div class="words"><span class="lbl">Amount in words</span><br><b>${amountWords(b.grand)}</b>${b.note?`<br><br><span class="lbl">Note</span><br>${esc(b.note)}`:''}</div>
      <div class="tots">
        <div class="tr"><span>Items total</span><span>${inr(t.gross)}</span></div>
        ${disc>0.004?`<div class="tr"><span>Discount</span><span>- ${inr(disc)}</span></div>`:''}
        ${gst?`<div class="tr"><span>Taxable value</span><span>${inr(t.taxable)}</span></div>${b.interState?`<div class="tr"><span>IGST</span><span>${inr(t.igst)}</span></div>`:`<div class="tr"><span>CGST</span><span>${inr(t.cgst)}</span></div><div class="tr"><span>SGST</span><span>${inr(t.sgst)}</span></div>`}`:''}
        ${Math.abs(t.round)>0.004?`<div class="tr"><span>Round off</span><span>${t.round>0?'+':'-'} ${inr(Math.abs(t.round))}</span></div>`:''}
        <div class="tr g"><span>Total</span><span>${inr(t.grand)}</span></div>
        ${bal>0.004?`<div class="tr"><span>Received</span><span>${inr(b.paidAmt)}</span></div><div class="tr" style="font-weight:700"><span>Balance due</span><span>${inr(bal)}</span></div>`:''}
      </div></div>
    <div class="foot"><div>${s.terms?esc(s.terms):''}${s.upi?`<br>UPI: ${esc(s.upi)}`:''}${s.bank?`<br><span style="white-space:pre-line">${esc(s.bank)}</span>`:''}</div>
      <div class="sign"><div></div>For ${esc(s.name)}<br>Authorised signature</div></div>
  </div>`;
}
function waLink(b){
  const t = calc(b), bal = b.grand - b.paidAmt;
  const lines = b.items.map(i => `${i.name} - ${+i.qty} ${i.unit} x ${inr(i.price).slice(1)}`);
  const txt = `*${b.shop.name}*\nBill ${b.no} dated ${fmtDate(b.date)}\n\n${lines.join('\n')}\n\nTotal: ${inr(t.grand)}` + (bal>0.004 ? `\nBalance due: ${inr(bal)}` : '') + `\n\nThank you!`;
  let ph = (b.customer.phone||'').replace(/\D/g,''); if(ph.length===10) ph = '91'+ph;
  return `https://wa.me/${ph}?text=${encodeURIComponent(txt)}`;
}

/* ============ dialogs ============ */
function openDlg(html){ const d=$('#dlg'); d.innerHTML=html; if(!d.open) d.showModal(); return d; }
function closeDlg(){ const d=$('#dlg'); if(d.open) d.close(); }
function askConfirm(msg, ok='Delete'){
  return new Promise(res => {
    const d = openDlg(`<div class="dbody"><p style="font-size:17px">${esc(msg)}</p><div class="drow"><button class="btn ghost" data-r="0">Cancel</button><button class="btn danger" data-r="1">${esc(ok)}</button></div></div>`);
    let done = false;
    const finish = v => { if(done) return; done = true; d.removeEventListener('click', h); res(v); };
    const h = e => { const b=e.target.closest('[data-r]'); if(b){ finish(b.dataset.r==='1'); closeDlg(); } };
    d.addEventListener('click', h);
    d.addEventListener('close', () => finish(false), { once:true });
  });
}

/* ============ actions ============ */
const ACT = {
  start(){ S.view = S.shop ? 'app' : 'setup'; if(S.shop) S.tab = S.products.length ? 'bill' : 'products'; render(); },
  intro(){ S.view='intro'; render(); },
  tab(el){ S.view='app'; S.tab=el.dataset.tab; if(!$('#main')) render(); else renderMain(); },
  goProducts(){ closeDlg(); S.tab='products'; renderMain(); },
  closeDlg(){ closeDlg(); },
  rmLogo(){ S.tmpLogo=''; $('#logoprev').textContent='Logo'; },
  saveShop(){
    const g = id => ($('#s_'+id)?.value || '').trim();
    const shop = { name:g('name'), owner:g('owner'), phone:g('phone'), email:g('email'), address:g('address'), city:g('city'), state:g('state'), pin:g('pin'),
      gstin:g('gstin').toUpperCase().replace(/\s/g,''), pan:g('pan').toUpperCase(), license:g('license'), defGst: g('defGst')==='' ? 18 : Math.max(0,+g('defGst')||0),
      upi:g('upi'), bank:g('bank'), prefix:g('prefix'), terms:g('terms'), logo:S.tmpLogo||'' };
    const err = (id,msg) => { const e=$('#formerr'); e.textContent=msg; $('#s_'+id)?.focus(); $('#s_'+id)?.setAttribute('aria-invalid','true'); };
    document.querySelectorAll('[aria-invalid]').forEach(x=>x.removeAttribute('aria-invalid'));
    $('#formerr').textContent='';
    if(!shop.name) return err('name','Enter your shop name.');
    if(!shop.phone) return err('phone','Enter a phone number for the bill.');
    if(!shop.address) return err('address','Enter your shop address.');
    if(shop.gstin && !/^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/.test(shop.gstin)) return err('gstin','This GSTIN does not look right. It has 15 characters, for example 07ABCDE1234F1Z5. Clear it if you have no GSTIN.');
    const first = !S.shop;
    S.shop = shop; store.set('bb_shop', shop);
    S.counter = Math.max(1, parseInt(g('nextNo'),10) || S.counter); store.set('bb_counter', S.counter);
    if(first){ S.view='app'; S.tab='products'; render(); toast('Shop saved. Now add your products.'); }
    else { toast('Changes saved.'); S.draft=null; render(); }
  },
  addProduct(){ productDialog(null); },
  editProduct(el){ productDialog(S.products.find(p=>p.id===el.dataset.id)); },
  rmPhoto(){ S.tmpImg=''; const pv=$('#pprev'); if(pv) pv.innerHTML = imgHTML({name:$('#p_name')?.value||'?'}); },
  saveProduct(){
    const name = $('#p_name').value.trim(), price = $('#p_price').value;
    const err = m => { $('#perr').textContent = m; };
    if(!name) return err('Enter the product name.');
    if(price==='' || !(+price >= 0)) return err('Enter a price.');
    const obj = { name, price:+price, unit:$('#p_unit').value, img:S.tmpImg||'', gst: hasGST() ? (+($('#p_gst')?.value)||0) : 0, hsn: ($('#p_hsn')?.value||'').trim() };
    if(S.editId){ const i=S.products.findIndex(p=>p.id===S.editId); S.products[i] = { ...S.products[i], ...obj }; }
    else S.products.unshift({ id:uid(), ...obj });
    saveProducts(); closeDlg(); renderMain(); toast('Product saved.');
  },
  async delProduct(el){
    const p = S.products.find(x=>x.id===el.dataset.id);
    if(await askConfirm(`Delete "${p.name}" from your products? Bills you already made are not changed.`)){ S.products = S.products.filter(x=>x.id!==p.id); saveProducts(); renderMain(); toast('Product deleted.'); }
  },
  openPicker(){
    S.pickCount = 0;
    openDlg(`<div class="dbody"><h2>Add products to this bill</h2><input class="in" id="pksearch" placeholder="Search products" autocomplete="off">
      <div class="pgrid sm" id="pkgrid">${pickerTiles('')}</div>
      <div class="drow" style="justify-content:space-between"><span class="hint" id="pkcount">Tap a product to add it.</span><button class="btn" data-act="closeDlg">Done</button></div></div>`);
  },
  pick(el){
    const p = S.products.find(x=>x.id===el.dataset.id); if(!p) return;
    addItem(p); S.pickCount++;
    $('#pkcount').textContent = `Added ${p.name}. ${S.pickCount} tap${S.pickCount>1?'s':''} so far.`;
    $('#lines').innerHTML = linesHTML(); refreshBill();
  },
  openCustom(){
    openDlg(`<div class="dbody"><h2>Add another item</h2><p class="hint">For something you don't keep in your product list. It is used on this bill only.</p>
      <label class="field">Item name *<input class="in" id="c_name" autocomplete="off"></label>
      <div class="grid2"><label class="field">Quantity<input class="in" id="c_qty" type="number" min="0" step="any" value="1"></label>
      <label class="field">Unit<select class="in" id="c_unit">${UNITS.map(u=>`<option>${u}</option>`).join('')}</select></label>
      <label class="field">Price (\u20B9) *<input class="in" id="c_price" type="number" min="0" step="any" inputmode="decimal"></label>
      ${hasGST() ? `<label class="field">GST %<input class="in" id="c_gst" type="number" min="0" step="any" list="gstlist" value="${esc(S.shop.defGst ?? 18)}"></label>` : ''}</div>
      <p class="errmsg" id="cerr" role="alert"></p>
      <div class="drow"><button class="btn ghost" data-act="closeDlg">Cancel</button><button class="btn" data-act="saveCustom">Add to bill</button></div></div>`);
    setTimeout(()=>$('#c_name')?.focus(), 30);
  },
  saveCustom(){
    const name=$('#c_name').value.trim(), price=$('#c_price').value, qty=$('#c_qty').value;
    if(!name) return $('#cerr').textContent='Enter the item name.';
    if(price==='') return $('#cerr').textContent='Enter a price.';
    if(!(+qty>0)) return $('#cerr').textContent='Enter a quantity above zero.';
    S.draft.items.push({ pid:null, name, unit:$('#c_unit').value, qty, price, listPrice:0, disc:'', gst: hasGST() ? String(+($('#c_gst')?.value)||0) : '0', hsn:'' });
    closeDlg(); $('#lines').innerHTML = linesHTML(); refreshBill();
  },
  removeLine(el){ S.draft.items.splice(+el.dataset.i,1); $('#lines').innerHTML = linesHTML(); refreshBill(); },
  resetPrice(el){ const it=S.draft.items[+el.dataset.i]; it.price=String(it.listPrice); $('#lines').innerHTML = linesHTML(); refreshBill(); },
  async clearDraft(){ if(!S.draft.items.length && !S.draft.customer.name) { S.draft=newDraft(); renderMain(); return; } if(await askConfirm('Clear everything on this bill?','Clear bill')){ S.draft=newDraft(); renderMain(); } },
  generate(){
    const d = S.draft;
    if(!d.items.length) return toast('Add at least one item first.');
    const bad = d.items.findIndex(it => !(+it.qty>0) || it.price==='' || !(+it.price>=0));
    if(bad>=0) return toast(`Check the quantity and price on item ${bad+1}.`);
    const t = calc(d);
    const { logo, ...snap } = S.shop;
    const bill = { id:uid(), no:(S.shop.prefix||'')+String(S.counter).padStart(4,'0'), date:d.date||todayISO(),
      customer:{ ...d.customer, name:d.customer.name.trim()||'Walk-in customer' }, items:d.items.map(x=>({...x})),
      interState:d.interState, inclusive:d.inclusive, discType:d.discType, discVal:d.discVal, payMode:d.payMode, note:d.note,
      grand:t.grand, paidAmt:paidAmount(d,t), shop:snap, created:Date.now() };
    S.bills.unshift(bill); S.counter++;
    saveBills(); store.set('bb_counter', S.counter);
    S.draft = null; S.viewBill = bill.id; S.tab = 'invoice'; renderMain();
  },
  viewBill(el){ S.viewBill=el.dataset.id; S.tab='invoice'; renderMain(); },
  markPaid(el){ const b=S.bills.find(x=>x.id===el.dataset.id); b.paidAmt=b.grand; saveBills(); renderMain(); toast('Marked as paid.'); },
  async delBill(el){ const b=S.bills.find(x=>x.id===el.dataset.id); if(await askConfirm(`Delete bill ${b.no}? This cannot be undone.`)){ S.bills=S.bills.filter(x=>x.id!==b.id); saveBills(); renderMain(); toast('Bill deleted.'); } },
  print(){ try{ window.print(); }catch(e){ toast('Printing is not available here. Open this page in its own browser tab.'); } }
};

document.addEventListener('click', e => {
  const t = e.target;
  if(t.id==='dlg'){ closeDlg(); return; }
  const el = t.closest('[data-act]'); if(!el) return;
  const fn = ACT[el.dataset.act]; if(fn) fn(el, e);
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.f !== undefined){ const line=t.closest('.line'); if(!line) return; S.draft.items[+line.dataset.i][t.dataset.f] = t.value; refreshBill(); return; }
  if(t.dataset.d){ setPath(S.draft, t.dataset.d, t.type==='checkbox' ? t.checked : t.value); if(t.type==='checkbox' && S.tab==='bill'){ /* totals labels depend on it */ } refreshBill(); return; }
  if(t.id==='psearch'){ S.pq=t.value; $('#plist').innerHTML = productCards(); }
  else if(t.id==='hsearch'){ S.hq=t.value; $('#hlist').innerHTML = historyRows(); }
  else if(t.id==='pksearch'){ $('#pkgrid').innerHTML = pickerTiles(t.value); }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if(t.id==='pfile' && t.files[0]){
    try{ S.tmpImg = await thumb(t.files[0], 360, 'image/jpeg', .75); $('#pprev').innerHTML = `<img src="${S.tmpImg}" alt="">`; }
    catch(err){ toast("Couldn't read that image. Try a JPG or PNG."); }
  }
  if(t.id==='logofile' && t.files[0]){
    try{ S.tmpLogo = await thumb(t.files[0], 300, 'image/png'); $('#logoprev').innerHTML = `<img src="${S.tmpLogo}" alt="Logo">`; }
    catch(err){ toast("Couldn't read that image. Try a JPG or PNG."); }
  }
  if(t.dataset && t.dataset.d==='interState' || t.dataset.d==='inclusive'){ /* handled by input event */ }
});

load();
render();
</script>
